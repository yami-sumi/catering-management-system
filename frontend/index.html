<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catering Management System</title>
  <link rel="stylesheet" href="style.css?v=light-dashboard-20261106">
</head>
<body>
  <header class="topbar">
    <div class="brand">Catering Management <a href="/customer.html" style="font-size:12px;margin-left:18px;color:inherit">Customer portal ↗</a></div>
    <div id="dbStatus" class="status" role="status">checking database…</div>
    <button type="button" id="logoutBtn">Log out</button>
  </header>
  <div class="layout">
    <nav id="nav" class="nav" aria-label="Modules"></nav>
    <main>
      <div class="main-head">
        <h1 id="title"></h1>
        <button id="addBtn" class="btn primary">+ Add</button>
      </div>
      <div id="notice" class="notice" hidden></div>
      <div class="table-wrap"><table id="table"></table></div>
      <p id="empty" class="empty" hidden>No records yet.</p>
    </main>
  </div>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="dlgTitle"></h2>
      <div id="fields"></div>
      <p id="formError" class="form-error" hidden></p>
      <div class="actions">
        <button type="button" id="cancelBtn" class="btn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
